[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[name] = "filesystem-scanner"
version = "0.1.0"
authors = [{name = "Your Name", email = "you@example.com"}]
description = "A comprehensive filesystem usage scanner and analyzer"
license = {file = "LICENSE", text = "MIT"}
repository-url = "https://github.com/yourusername/filesystem-scanner"

[project.urls]
documentation = "https://github.com/yourusername/filesystem-scanner/wiki"
source = "https://github.com/yourusername/filesystem-scanner"
tracker = "https://github.com/yourusername/filesystem-scanner/issues"

[dependencies]
python = ">=3.8,<3.12"
click = "^8.0.0"
rich = "^12.0.0"
typing-extensions = "^4.5.0"

[optional-dependencies]
dev = ["pytest", "black", "isort"]
docs = ["sphinx", "myst-parser"]

[tool.setuptools.packages.find]
where = ["."]
include = ["filesystem_scanner"]
